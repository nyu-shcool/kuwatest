<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>対戦</title>
    <!--
        対戦画面です。
        スマホの枠・ステータスバー・下のタブは index.html 側にあるので、このファイルには画面の中身だけを書いています。
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; background-color: #0f172a; margin: 0; height: 100vh; user-select: none; overflow: hidden; }
        .font-display { font-family: 'Fredoka One', cursive; }
        .pixel-font { font-family: 'DotGothic16', sans-serif; }
        .glass-panel { background: rgba(15, 36, 20, 0.78); backdrop-filter: blur(8px); border: 1px solid rgba(167, 243, 208, 0.35); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35); }

        @keyframes rotateLines { 100% { transform: rotate(360deg); } }
        .speed-lines { background: repeating-conic-gradient(from 0deg, transparent 0deg 10deg, rgba(255, 255, 255, 0.12) 10deg 20deg); animation: rotateLines 18s linear infinite; }

        @keyframes tackle-right { 0% { transform: translate(0, 0) scale(1); } 30% { transform: translate(-18px, 8px) scale(0.92); } 60% { transform: translate(65px, -35px) scale(1.22); } 100% { transform: translate(0, 0) scale(1); } }
        .anim-tackle-right { animation: tackle-right 0.4s ease-in-out; }

        @keyframes tackle-left { 0% { transform: translate(0, 0) scaleX(-1) scaleY(1); } 30% { transform: translate(18px, 8px) scaleX(-1) scaleY(0.92); } 60% { transform: translate(-65px, 35px) scaleX(-1) scaleY(1.22); } 100% { transform: translate(0, 0) scaleX(-1) scaleY(1); } }
        .anim-tackle-left { animation: tackle-left 0.4s ease-in-out; }

        @keyframes shake { 0%, 100% { transform: translateX(0); filter: brightness(1); } 20% { transform: translateX(-10px); filter: brightness(2); } 40% { transform: translateX(10px); filter: brightness(1); } 60% { transform: translateX(-10px); filter: brightness(2); } 80% { transform: translateX(10px); filter: brightness(1); } }
        .anim-shake { animation: shake 0.4s; }

        @keyframes shake-enemy { 0%, 100% { transform: scaleX(-1) translateX(0); filter: brightness(1); } 20% { transform: scaleX(-1) translateX(-10px); filter: brightness(2); } 40% { transform: scaleX(-1) translateX(10px); filter: brightness(1); } 60% { transform: scaleX(-1) translateX(-10px); filter: brightness(2); } 80% { transform: scaleX(-1) translateX(10px); filter: brightness(1); } }
        .anim-shake-enemy { animation: shake-enemy 0.4s; }

        @keyframes damagePop { 0% { transform: scale(0.5) translateY(0); opacity: 1; } 40% { transform: scale(1.3) translateY(-25px); opacity: 1; } 100% { transform: scale(1) translateY(-55px); opacity: 0; } }
        .damage-number { position: absolute; font-weight: 900; font-size: 2.2rem; -webkit-text-stroke: 2px #1e293b; animation: damagePop 0.9s ease-out forwards; z-index: 50; pointer-events: none; text-shadow: 0px 4px 8px rgba(0,0,0,0.7); font-family: 'Fredoka One', cursive; }
        .damage-player { color: #f87171; }
        .damage-enemy { color: #facc15; }
        .damage-heal { color: #4ade80; }

        .slash-effect { position: absolute; top: 45%; left: 50%; width: 140%; height: 16px; background: white; transform: translate(-50%, -50%) rotate(-35deg) scaleX(0); opacity: 0; z-index: 45; pointer-events: none; }
        @keyframes slash { 0% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(0); opacity: 1; } 50% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(1); opacity: 1; box-shadow: 0 0 25px 10px rgba(255,255,255,0.85); } 100% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(1.4); opacity: 0; } }
        .anim-slash { animation: slash 0.32s ease-out; }
    </style>
</head>
<body>

    <!-- バトル画面本体 -->
    <div class="relative h-full w-full flex flex-col bg-amber-950 text-white overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-red-950 via-emerald-950 to-slate-950 z-0">
            <div class="absolute inset-[-50%] speed-lines opacity-35 mix-blend-overlay pointer-events-none"></div>
            <div class="absolute top-[46%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-72 h-36 rounded-full border-2 border-amber-500/30 shadow-[0_0_30px_rgba(245,158,11,0.2)]"></div>
        </div>

        <!-- ヘッダー（上の 40px くらいはステータスバーと重なるので、pt-10 で空けています） -->
        <div class="relative z-20 bg-black/50 backdrop-blur-sm py-2.5 pt-10 px-4 border-b border-amber-500/30 flex justify-between items-center">
            <span class="font-display text-amber-400 tracking-wider text-base">🔥 INSECT BATTLE</span>
            <a href="home.html" class="text-[11px] bg-white/10 hover:bg-white/20 px-2.5 py-1 rounded-lg font-bold">
                ホームへ
            </a>
        </div>

        <!-- バトルアリーナ -->
        <div id="battle-arena" class="relative flex-1 flex flex-col justify-between p-4 z-10 overflow-hidden">
            <div id="battle-effects-layer" class="absolute inset-0 pointer-events-none z-50"></div>
            <div id="slash-layer" class="slash-effect"></div>

            <div class="absolute top-[45%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 font-display italic text-[90px] text-white/5 pointer-events-none select-none">VS</div>

            <!-- 敵エリア (右上) -->
            <div class="flex justify-between items-start w-full mt-1">
                <div class="glass-panel rounded-2xl p-2.5 w-[215px] border-l-4 border-l-red-500">
                    <div class="flex justify-between items-center mb-1">
                        <span id="battle-enemy-name" class="font-black text-xs truncate">オオスズメバチ</span>
                        <span class="text-[10px] bg-red-600 px-1.5 py-0.2 rounded font-bold">RIVAL</span>
                    </div>
                    <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-700">
                        <div id="battle-enemy-hp-bar" class="bg-gradient-to-r from-red-600 to-orange-400 h-full transition-all duration-300" style="width: 100%;"></div>
                    </div>
                    <div class="text-right text-[10px] pixel-font text-gray-300 mt-0.5">
                        HP <span id="battle-enemy-hp">240</span>/<span id="battle-enemy-maxhp">240</span>
                    </div>
                </div>

                <div id="battle-enemy-sprite" class="w-28 h-28 flex items-center justify-center transform -scale-x-100 drop-shadow-[0_10px_15px_rgba(0,0,0,0.7)] transition-all"></div>
            </div>

            <!-- 味方エリア (左下) -->
            <div class="flex justify-between items-end w-full mb-1">
                <div id="battle-player-sprite" class="w-32 h-32 flex items-center justify-center drop-shadow-[0_12px_18px_rgba(0,0,0,0.7)] transition-all"></div>

                <div class="glass-panel rounded-2xl p-2.5 w-[215px] border-r-4 border-r-emerald-400">
                    <div class="flex justify-between items-center mb-1">
                        <span id="battle-player-name" class="font-black text-xs truncate">ミヤマクワガタ</span>
                        <span id="battle-player-lv" class="text-[10px] text-lime-300 font-bold">Lv.18</span>
                    </div>
                    <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-700">
                        <div id="battle-player-hp-bar" class="bg-gradient-to-r from-emerald-500 to-lime-400 h-full transition-all duration-300" style="width: 100%;"></div>
                    </div>
                    <div class="text-right text-[10px] pixel-font text-gray-300 mt-0.5">
                        HP <span id="battle-player-hp">260</span>/<span id="battle-player-maxhp">260</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 下部バトルコンソール -->
        <div class="relative z-20 bg-slate-950/95 border-t-2 border-emerald-800/80 p-3 pb-4">
            <div class="h-14 bg-black/70 rounded-xl p-2.5 border border-emerald-900/80 mb-2.5 flex items-center">
                <p id="battle-message" class="pixel-font text-xs leading-relaxed text-emerald-100">
                    野生の オオスズメバチ があらわれた！どうする？
                </p>
            </div>

            <!-- コマンドボタン群 -->
            <div id="battle-commands" class="grid grid-cols-2 gap-2">
                <button onclick="executeBattleAction('attack')" class="bg-gradient-to-b from-red-500 to-red-700 border-b-4 border-red-900 text-white font-black py-2.5 rounded-xl active:translate-y-0.5 transition flex items-center justify-center gap-1.5 text-sm">
                    <span>⚔️</span> とっしん
                </button>
                <button onclick="executeBattleAction('skill')" class="bg-gradient-to-b from-amber-500 to-orange-600 border-b-4 border-orange-900 text-white font-black py-2.5 rounded-xl active:translate-y-0.5 transition flex flex-col items-center justify-center leading-tight">
                    <span class="text-xs">✨ 必殺スキル</span>
                    <span id="battle-skill-label" class="text-[9px] text-yellow-200">ミヤマシザース</span>
                </button>
                <button onclick="executeBattleAction('guard')" class="bg-gradient-to-b from-sky-500 to-blue-700 border-b-4 border-blue-900 text-white font-black py-2.5 rounded-xl active:translate-y-0.5 transition flex items-center justify-center gap-1.5 text-sm">
                    <span>🛡️</span> かたくなる
                </button>
                <button onclick="executeBattleAction('heal')" class="bg-gradient-to-b from-emerald-500 to-green-700 border-b-4 border-green-900 text-white font-black py-2.5 rounded-xl active:translate-y-0.5 transition flex items-center justify-center gap-1.5 text-sm">
                    <span>🍯</span> 樹液を吸う
                </button>
            </div>

            <!-- 決着後のリスタートメニュー -->
            <div id="battle-restart" class="hidden grid-cols-2 gap-2">
                <button onclick="setupBattleArena()" class="bg-gradient-to-r from-emerald-500 to-green-600 text-white font-black py-3 rounded-xl shadow-lg text-xs">
                    次の相手と戦う！
                </button>
                <a href="home.html" class="bg-slate-800 border border-slate-600 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center">
                    ホームへ戻る
                </a>
            </div>
        </div>
    </div>

    <script>
        // ==================== 昆虫マスターデータ ====================
        const INSECT_MASTER = [
            {
                id: '001', name: 'ミヤマクワガタ', hp: 260, atk: 120, def: 140, skillName: 'ミヤマシザース',
                svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 38 38 C 22 18, 26 4, 34 6 C 36 12, 42 22, 44 38 Z" fill="#451a03"/><path d="M 62 38 C 78 18, 74 4, 66 6 C 64 12, 58 22, 56 38 Z" fill="#451a03"/><path d="M 30 16 L 37 18 M 70 16 L 63 18" stroke="#451a03" stroke-width="3" stroke-linecap="round"/><path d="M 34 36 L 66 36 L 62 48 L 38 48 Z" fill="#5c2408"/><ellipse cx="50" cy="70" rx="20" ry="25" fill="#78350f"/><line x1="50" y1="48" x2="50" y2="95" stroke="#290f02" stroke-width="2"/><path d="M 32 52 Q 14 44 10 56 M 30 68 Q 12 68 8 78 M 34 82 Q 20 92 16 98" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round"/><path d="M 68 52 Q 86 44 90 56 M 70 68 Q 88 68 92 78 M 66 82 Q 80 92 84 98" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round"/></svg>`
            },
            {
                id: '002', name: 'ナミアゲハ', hp: 210, atk: 105, def: 90, skillName: 'アゲハトルネード',
                svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 47 20 C 40 2, 12 0, 6 28 C 2 46, 44 50, 47 50 Z" fill="#fef08a" stroke="#1f2937" stroke-width="2.5"/><path d="M 53 20 C 60 2, 88 0, 94 28 C 98 46, 56 50, 53 50 Z" fill="#fef08a" stroke="#1f2937" stroke-width="2.5"/><path d="M 47 50 C 42 54, 18 62, 16 84 C 14 98, 42 82, 47 72 L 46 92 L 50 86 Z" fill="#fde047" stroke="#1f2937" stroke-width="2.5"/><path d="M 53 50 C 58 54, 82 62, 84 84 C 86 98, 58 82, 53 72 L 54 92 L 50 86 Z" fill="#fde047" stroke="#1f2937" stroke-width="2.5"/><circle cx="24" cy="76" r="3.5" fill="#ef4444"/><circle cx="76" cy="76" r="3.5" fill="#ef4444"/><rect x="47" y="16" width="6" height="56" rx="3" fill="#1f2937"/><path d="M 48 16 Q 38 6 34 10 M 52 16 Q 62 6 66 10" fill="none" stroke="#1f2937" stroke-width="2"/></svg>`
            },
            {
                id: '003', name: 'ナナホシテントウ', hp: 200, atk: 85, def: 115, skillName: 'ラッキーセブンガード',
                svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="26" r="14" fill="#111827"/><circle cx="44" cy="20" r="3" fill="#fff"/><circle cx="56" cy="20" r="3" fill="#fff"/><circle cx="50" cy="58" r="32" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><line x1="50" y1="26" x2="50" y2="90" stroke="#111827" stroke-width="2.5"/><circle cx="50" cy="40" r="4.5" fill="#111827"/><circle cx="34" cy="50" r="4.5" fill="#111827"/><circle cx="66" cy="50" r="4.5" fill="#111827"/><circle cx="32" cy="68" r="4.5" fill="#111827"/><circle cx="68" cy="68" r="4.5" fill="#111827"/><circle cx="40" cy="80" r="4" fill="#111827"/><circle cx="60" cy="80" r="4" fill="#111827"/></svg>`
            },
            {
                id: '004', name: 'ヤマトカブトムシ', hp: 280, atk: 145, def: 130, skillName: 'カブトホーン投げ',
                svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 50 10 L 42 5 L 47 16 L 46 38 L 54 38 L 53 16 L 58 5 Z" fill="#451a03"/><ellipse cx="50" cy="44" rx="15" ry="10" fill="#5c2408"/><ellipse cx="50" cy="70" rx="22" ry="25" fill="#7c2d12"/><line x1="50" y1="45" x2="50" y2="95" stroke="#290f02" stroke-width="2"/><path d="M 28 50 Q 14 44 10 54 M 26 66 Q 10 66 8 76 M 30 82 Q 18 90 14 98" fill="none" stroke="#3e2723" stroke-width="3.5" stroke-linecap="round"/><path d="M 72 50 Q 86 44 90 54 M 74 66 Q 90 66 92 76 M 70 82 Q 82 90 86 98" fill="none" stroke="#3e2723" stroke-width="3.5" stroke-linecap="round"/></svg>`
            },
            {
                id: '005', name: 'オオクワガタ', hp: 300, atk: 160, def: 150, skillName: 'ブラックダイヤクラッシュ',
                svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 40 38 C 24 20, 28 6, 36 8 C 36 16, 44 24, 45 38 Z" fill="#111827"/><path d="M 60 38 C 76 20, 72 6, 64 8 C 64 16, 56 24, 55 38 Z" fill="#111827"/><path d="M 33 20 L 40 20 M 67 20 L 60 20" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="50" cy="45" rx="18" ry="11" fill="#1f2937"/><ellipse cx="50" cy="72" rx="21" ry="24" fill="#0f172a"/><line x1="50" y1="46" x2="50" y2="96" stroke="#334155" stroke-width="1.5"/><path d="M 30 50 Q 14 44 10 54 M 28 66 Q 10 66 8 76 M 32 82 Q 18 90 14 98" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/><path d="M 70 50 Q 86 44 90 54 M 72 66 Q 90 66 92 76 M 68 82 Q 82 90 86 98" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/></svg>`
            },
            {
                id: '006', name: 'オオカマキリ', hp: 230, atk: 140, def: 95, skillName: 'ソニック鎌スラッシュ',
                svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 46 34 L 54 34 L 58 92 L 42 92 Z" fill="#16a34a"/><rect x="48" y="16" width="4" height="20" fill="#22c55e"/><polygon points="40,8 60,8 50,20" fill="#4ade80"/><circle cx="42" cy="10" r="3" fill="#111827"/><circle cx="58" cy="10" r="3" fill="#111827"/><path d="M 47 22 Q 22 10 12 28 L 26 42" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/><path d="M 53 22 Q 78 10 88 28 L 74 42" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/><path d="M 45 50 Q 18 42 10 68 M 44 68 Q 18 62 10 92" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/><path d="M 55 50 Q 82 42 90 68 M 56 68 Q 82 62 90 92" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/></svg>`
            },
            {
                id: '007', name: 'オオスズメバチ', hp: 240, atk: 155, def: 95, skillName: 'ベノムスティンガー',
                svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><ellipse cx="26" cy="42" rx="20" ry="8" transform="rotate(-20 26 42)" fill="rgba(255,255,255,0.65)" stroke="#94a3b8"/><ellipse cx="74" cy="42" rx="20" ry="8" transform="rotate(20 74 42)" fill="rgba(255,255,255,0.65)" stroke="#94a3b8"/><circle cx="50" cy="22" r="11" fill="#f59e0b"/><ellipse cx="50" cy="40" rx="12" ry="10" fill="#111827"/><ellipse cx="50" cy="68" rx="16" ry="22" fill="#facc15"/><path d="M 35 60 L 65 60 M 34 68 L 66 68 M 36 76 L 64 76" stroke="#111827" stroke-width="4.5"/><polygon points="47,89 53,89 50,97" fill="#111827"/></svg>`
            },
            {
                id: '008', name: 'ヘラクレスオオカブト', hp: 340, atk: 180, def: 165, skillName: 'ヘラクレス・ギガインパクト',
                svg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 46 42 L 48 4 L 52 4 L 54 42 Z" fill="#111827"/><path d="M 48 24 L 44 16 L 49 20 Z" fill="#111827"/><ellipse cx="50" cy="44" rx="16" ry="11" fill="#111827"/><ellipse cx="50" cy="72" rx="22" ry="24" fill="#eab308" stroke="#854d0e" stroke-width="2"/><line x1="50" y1="48" x2="50" y2="96" stroke="#422006" stroke-width="2"/><circle cx="42" cy="62" r="2.5" fill="#422006"/><circle cx="58" cy="70" r="3" fill="#422006"/><circle cx="40" cy="80" r="2" fill="#422006"/><path d="M 28 52 Q 12 46 8 56 M 26 68 Q 8 68 6 78 M 30 84 Q 16 92 12 98" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/><path d="M 72 52 Q 88 46 92 56 M 74 68 Q 92 68 94 78 M 70 84 Q 84 92 88 98" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/></svg>`
            }
        ];

        const STORAGE_KEY = 'insect_adventure_state_v1';
        const DEFAULT_STATE = {
            buddyId: '001', enemyId: null, currentSpot: '周辺フィールド',
            playerLv: 12, playerExp: 60, coins: 1250, gems: 45,
            missionDone: 1, missionMax: 3, unlockedIds: ['001', '002', '003']
        };

        function loadAppState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? { ...DEFAULT_STATE, ...JSON.parse(raw) } : { ...DEFAULT_STATE };
            } catch (e) {
                return { ...DEFAULT_STATE };
            }
        }

        function saveAppState(state) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        }

        let appState = loadAppState();
        let battleState = { player: null, enemy: null, isPlayerTurn: true, isAnimating: false, guardActive: false };

        function setupBattleArena() {
            const buddy = INSECT_MASTER.find(i => i.id === appState.buddyId) || INSECT_MASTER[0];

            // 図鑑から対戦指定があればその敵を、なければランダム選出
            let enemyBase = appState.enemyId ? INSECT_MASTER.find(i => i.id === appState.enemyId) : null;
            if (!enemyBase || enemyBase.id === buddy.id) {
                const candidates = INSECT_MASTER.filter(i => i.id !== buddy.id);
                enemyBase = candidates[Math.floor(Math.random() * candidates.length)];
            }
            appState.enemyId = null;
            saveAppState(appState);

            battleState.player = { ...buddy, maxHp: buddy.hp, currentHp: buddy.hp };
            battleState.enemy = { ...enemyBase, maxHp: enemyBase.hp + 20, currentHp: enemyBase.hp + 20 };
            battleState.isPlayerTurn = true;
            battleState.isAnimating = false;
            battleState.guardActive = false;

            document.getElementById('battle-player-name').innerText = battleState.player.name;
            document.getElementById('battle-player-lv').innerText = `Lv.${appState.playerLv + 6}`;
            document.getElementById('battle-player-sprite').innerHTML = battleState.player.svg;
            document.getElementById('battle-player-sprite').style.opacity = '1';
            document.getElementById('battle-player-sprite').style.transform = 'none';
            document.getElementById('battle-skill-label').innerText = battleState.player.skillName;

            document.getElementById('battle-enemy-name').innerText = battleState.enemy.name;
            document.getElementById('battle-enemy-sprite').innerHTML = battleState.enemy.svg;
            document.getElementById('battle-enemy-sprite').style.opacity = '1';
            document.getElementById('battle-enemy-sprite').style.transform = 'scaleX(-1)';

            updateBattleHpBars();

            document.getElementById('battle-commands').classList.remove('hidden');
            document.getElementById('battle-commands').classList.add('grid');
            document.getElementById('battle-restart').classList.add('hidden');
            document.getElementById('battle-restart').classList.remove('grid');

            document.getElementById('battle-message').innerHTML = `野生の <span class="text-amber-300 font-bold">${battleState.enemy.name}</span> があらわれた！<br>コマンドを選ぼう！`;
        }

        function updateBattleHpBars() {
            const p = battleState.player;
            const e = battleState.enemy;
            p.currentHp = Math.max(0, p.currentHp);
            e.currentHp = Math.max(0, e.currentHp);

            document.getElementById('battle-player-hp').innerText = p.currentHp;
            document.getElementById('battle-player-maxhp').innerText = p.maxHp;
            document.getElementById('battle-player-hp-bar').style.width = `${(p.currentHp / p.maxHp) * 100}%`;

            document.getElementById('battle-enemy-hp').innerText = e.currentHp;
            document.getElementById('battle-enemy-maxhp').innerText = e.maxHp;
            document.getElementById('battle-enemy-hp-bar').style.width = `${(e.currentHp / e.maxHp) * 100}%`;
        }

        function spawnDamagePopup(targetElementId, amount, styleClass = 'damage-enemy') {
            const layer = document.getElementById('battle-effects-layer');
            const target = document.getElementById(targetElementId);
            const rect = target.getBoundingClientRect();
            const layerRect = layer.getBoundingClientRect();

            const el = document.createElement('span');
            el.className = `damage-number ${styleClass}`;
            el.innerText = amount;
            el.style.left = `${rect.left - layerRect.left + rect.width / 2 - 25}px`;
            el.style.top = `${rect.top - layerRect.top + 10}px`;

            layer.appendChild(el);
            setTimeout(() => el.remove(), 900);
        }

        const wait = (ms) => new Promise(res => setTimeout(res, ms));

        async function executeBattleAction(type) {
            if (battleState.isAnimating || !battleState.isPlayerTurn) return;
            battleState.isAnimating = true;
            battleState.guardActive = false;

            const p = battleState.player;
            const e = battleState.enemy;
            const pSprite = document.getElementById('battle-player-sprite');
            const eSprite = document.getElementById('battle-enemy-sprite');
            const slash = document.getElementById('slash-layer');
            const msg = document.getElementById('battle-message');

            if (type === 'attack') {
                msg.innerHTML = `${p.name} の とっしん攻撃！`;
                await wait(450);
                pSprite.classList.add('anim-tackle-right');
                await wait(180);
                slash.classList.add('anim-slash');

                const dmg = Math.max(15, Math.floor((p.atk * 0.55 - e.def * 0.2) * (0.9 + Math.random() * 0.25)));
                e.currentHp -= dmg;
                eSprite.classList.add('anim-shake-enemy');
                spawnDamagePopup('battle-enemy-sprite', `-${dmg}`, 'damage-enemy');
                updateBattleHpBars();
                msg.innerHTML = `${e.name} に <span class="text-yellow-300 font-bold">${dmg}</span> のダメージ！`;
            } else if (type === 'skill') {
                msg.innerHTML = `${p.name} の必殺技！<br><span class="text-amber-300 font-bold">「${p.skillName}」</span>！`;
                await wait(600);
                pSprite.classList.add('anim-tackle-right');
                await wait(180);
                slash.classList.add('anim-slash');

                const isCrit = Math.random() < 0.45;
                const mult = isCrit ? 1.45 : 1.15;
                const dmg = Math.max(25, Math.floor((p.atk * 0.65 * mult - e.def * 0.15)));
                e.currentHp -= dmg;
                eSprite.classList.add('anim-shake-enemy');
                spawnDamagePopup('battle-enemy-sprite', isCrit ? `CRIT! -${dmg}` : `-${dmg}`, 'damage-enemy');
                updateBattleHpBars();
                msg.innerHTML = isCrit
                    ? `急所にヒット！ ${e.name} に <span class="text-yellow-300 font-bold">${dmg}</span> の大ダメージ！`
                    : `${e.name} に <span class="text-yellow-300 font-bold">${dmg}</span> のダメージ！`;
            } else if (type === 'guard') {
                battleState.guardActive = true;
                msg.innerHTML = `${p.name} は甲羅を固めて身を守っている！<br>（次のダメージを大幅軽減）`;
                await wait(750);
            } else if (type === 'heal') {
                const heal = Math.floor(p.maxHp * 0.3);
                p.currentHp = Math.min(p.maxHp, p.currentHp + heal);
                spawnDamagePopup('battle-player-sprite', `+${heal}`, 'damage-heal');
                updateBattleHpBars();
                msg.innerHTML = `${p.name} は甘い樹液を吸って体力を <span class="text-emerald-300 font-bold">${heal}</span> 回復した！`;
                await wait(750);
            }

            await wait(450);
            pSprite.classList.remove('anim-tackle-right');
            eSprite.classList.remove('anim-shake-enemy');
            slash.classList.remove('anim-slash');

            if (e.currentHp <= 0) {
                finishBattle(true);
                return;
            }

            // 敵のターン
            battleState.isPlayerTurn = false;
            await wait(500);
            msg.innerHTML = `${e.name} の反撃！`;
            await wait(500);

            eSprite.classList.add('anim-tackle-left');
            await wait(180);
            slash.classList.add('anim-slash');

            let rawDmg = Math.max(12, Math.floor((e.atk * 0.5 - p.def * 0.2) * (0.9 + Math.random() * 0.25)));
            if (battleState.guardActive) rawDmg = Math.max(4, Math.floor(rawDmg * 0.35));

            p.currentHp -= rawDmg;
            pSprite.classList.add('anim-shake');
            spawnDamagePopup('battle-player-sprite', `-${rawDmg}`, 'damage-player');
            updateBattleHpBars();

            msg.innerHTML = battleState.guardActive
                ? `ガード成功！ダメージを <span class="text-sky-300 font-bold">${rawDmg}</span> に抑えた！`
                : `${p.name} は <span class="text-red-400 font-bold">${rawDmg}</span> のダメージを受けた！`;

            await wait(550);
            eSprite.classList.remove('anim-tackle-left');
            pSprite.classList.remove('anim-shake');
            slash.classList.remove('anim-slash');

            if (p.currentHp <= 0) {
                finishBattle(false);
                return;
            }

            battleState.isPlayerTurn = true;
            battleState.isAnimating = false;
            msg.innerHTML = `どうする？ コマンドを選ぼう！`;
        }

        function finishBattle(isWin) {
            const msg = document.getElementById('battle-message');
            const pSprite = document.getElementById('battle-player-sprite');
            const eSprite = document.getElementById('battle-enemy-sprite');

            document.getElementById('battle-commands').classList.add('hidden');
            document.getElementById('battle-commands').classList.remove('grid');
            document.getElementById('battle-restart').classList.remove('hidden');
            document.getElementById('battle-restart').classList.add('grid');

            if (isWin) {
                eSprite.style.opacity = '0.2';
                eSprite.style.transform = 'scaleX(-1) rotate(90deg) translateY(20px)';
                msg.innerHTML = `🎉 <span class="text-yellow-300 font-bold">${battleState.enemy.name}</span> に勝利した！<br>報酬: EXP +40 / 🪙 +120 を獲得！`;

                appState.coins += 120;
                appState.playerExp += 40;
                if (appState.playerExp >= 100) {
                    appState.playerExp -= 100;
                    appState.playerLv += 1;
                    appState.gems += 5;
                }
                saveAppState(appState);
            } else {
                pSprite.style.opacity = '0.2';
                pSprite.style.transform = 'rotate(-90deg) translateY(20px)';
                msg.innerHTML = `💦 ${battleState.player.name} は力尽きた…<br>しっかり休んで再挑戦しよう！`;
            }
        }

        window.onload = () => {
            setupBattleArena();
        };
    </script>
</body>
</html>
