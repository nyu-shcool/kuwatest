<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Insect Adventure</title>
    <!--
        このファイルは「アプリの外枠」です。
        スマホの枠・ステータスバー・下のタブだけを持っていて、真ん中の <iframe> に pages/ フォルダの HTML を表示します。
        ふだんの開発でこのファイルを触る必要はほとんどありません。
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #1a202c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden;
        }

        /* 下のタブ（ふつうのとき） */
        .tab {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 18%;
            height: 3rem;
            color: #ffcc80;
            transition: all 0.2s ease-in-out;
        }
        .tab:hover {
            color: #ffffff;
        }
        .tab .icon {
            font-size: 1.25rem;
            line-height: 1;
        }
        .tab .label {
            font-size: 9px;
            font-weight: 900;
            margin-top: 0.25rem;
        }

        /* 下のタブ（選ばれているとき） */
        .tab.active {
            height: 3.5rem;
            background: #ffca28;
            border-radius: 0.75rem;
            border-bottom: 4px solid #ff8f00;
            color: #4e342e;
            transform: translateY(-0.5rem);
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- スマートフォンのモックアップコンテナ -->
    <div class="relative w-full max-w-[390px] h-[844px] sm:h-[800px] bg-black sm:rounded-[3rem] sm:border-[10px] border-gray-800 shadow-2xl overflow-hidden flex flex-col">

        <!-- ステータスバー (ダミー) -->
        <div class="h-8 w-full flex justify-between items-center px-6 text-white text-xs font-bold absolute top-0 z-50 pointer-events-none">
            <span id="clock">15:24</span>
            <div class="flex items-center gap-2">
                <span>4G</span>
                <span>🔋 88%</span>
            </div>
        </div>

        <!-- 画面: タブの <a target="screen"> を押すと、この iframe の中身が変わる -->
        <div class="relative flex-1 w-full h-full">
            <iframe name="screen" id="screen" src="pages/home.html" title="画面" class="absolute inset-0 w-full h-full border-0 bg-black"></iframe>
        </div>

        <!-- ================= BOTTOM NAVIGATION ================= -->
        <!--
            タブはふつうの <a> タグです。
            href   : 開くページ
            target : "screen" にすると、上の <iframe name="screen"> の中に開く
        -->
        <nav id="tabs" class="w-full h-20 bg-[#4e342e] flex justify-around items-end px-2 pb-3 rounded-b-[2rem] sm:rounded-b-[2.5rem] border-t-[6px] border-[#3e2723] z-50 relative">
            <!-- 木目調の背景テクスチャ(CSS表現) -->
            <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, #000 10px, #000 20px);"></div>

            <a class="tab active" href="pages/home.html" target="screen">
                <span class="icon">🏠</span>
                <span class="label">ホーム</span>
            </a>
            <a class="tab" href="pages/battle.html" target="screen">
                <span class="icon">⚔️</span>
                <span class="label">対戦</span>
            </a>
            <a class="tab" href="pages/ar.html" target="screen">
                <span class="icon">📷</span>
                <span class="label">AR探索</span>
            </a>
            <a class="tab" href="pages/zukan.html" target="screen">
                <span class="icon">📖</span>
                <span class="label">図鑑</span>
            </a>
            <a class="tab" href="pages/shop.html" target="screen">
                <span class="icon">👜</span>
                <span class="label">ショップ</span>
            </a>
        </nav>

    </div>

    <!--
        ここから下は「見た目」のための JavaScript です。
        画面の切り替えは上の <a> タグだけで動くので、読まなくても大丈夫です。
    -->
    <script>
        const tabs = document.querySelectorAll(".tab");
        const screen = document.getElementById("screen");

        // 開いているページに合わせて、タブを黄色く光らせる
        function highlight(fileName) {
            tabs.forEach((tab) => {
                tab.classList.toggle("active", tab.getAttribute("href").endsWith("/" + fileName));
            });
        }

        // タブを押したとき
        tabs.forEach((tab) => {
            tab.addEventListener("click", () => {
                highlight(tab.getAttribute("href").split("/").pop());
            });
        });

        // ページの中のリンク（例: ホームのコレクション）で移動したとき
        screen.addEventListener("load", () => {
            try {
                highlight(screen.contentWindow.location.pathname.split("/").pop());
            } catch (e) {
                // ファイルをダブルクリックで開いたときは、ブラウザの制限でここに来ることがあります（動作には影響なし）
            }
        });

        // 現在時刻の更新
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, "0");
            const minutes = now.getMinutes().toString().padStart(2, "0");
            document.getElementById("clock").innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
